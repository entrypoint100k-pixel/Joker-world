<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10091d">
  <meta name="description" content="JOKER WORLDS - Midnight Arcade">
  <title>JOKER WORLDS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="joker.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">

    <header id="header">
      <div class="logo">🃏 JOKER WORLDS</div>
      <div class="coins">
        <span>🪙</span>
        <span id="coins">1000</span>
      </div>
    </header>

    <main>

      <!-- INTRO -->
      <section id="intro" class="screen">
        <h1>JOKER WORLDS</h1>
        <p>MIDNIGHT ARCADE</p>
        <div class="joker-logo">🃏</div>
        <button id="play">PLAY</button>
      </section>

      <!-- MENU -->
      <section id="menu" class="screen hidden">
        <h2>ARCADE</h2>
        <div class="menu-buttons">
          <button id="slots">🎰 JOKER SLOTS</button>
          <button id="scratch">🎟️ SCRATCH PIXEL</button>
          <button id="rush">⚡ PIXEL RUSH</button>
          <button id="shop">🛒 TIENDA</button>
          <button id="skills">🌳 HABILIDADES</button>
          <button id="leaderboard">🏆 CLASIFICACIÓN</button>
          <button id="stats">📊 ESTADÍSTICAS</button>
        </div>
      </section>

      <!-- JUEGOS -->
      <section id="gamePage" class="screen hidden">
        <button id="backMenu">⬅ VOLVER</button>
        <h2 id="gameTitle">ARCADE</h2>
        <div id="gameContent"></div>
        <div id="slotMachine"></div>
        <button id="spin">JUGAR</button>
        <div id="gameResult"></div>
      </section>

      <!-- TIENDA -->
      <section id="shopPage" class="screen hidden">
        <button id="backMenuShop">⬅ VOLVER</button>
        <h2>TIENDA</h2>
        <div id="shopTimer"></div>
        <div id="shopList"></div>
      </section>

      <!-- HABILIDADES -->
      <section id="skillsPage" class="screen hidden">
        <button id="backMenuSkills">⬅ VOLVER</button>
        <h2>ÁRBOL DE HABILIDADES</h2>
        <div id="skillTree"></div>
      </section>

      <!-- CLASIFICACIÓN -->
      <section id="leaderboardPage" class="screen hidden">
        <button id="backMenuLeaderboard">⬅ VOLVER</button>
        <h2>CLASIFICACIÓN GLOBAL</h2>
        <div id="leaderboardList"></div>
      </section>

      <!-- ESTADÍSTICAS -->
      <section id="statsPage" class="screen hidden">
        <button id="backMenuStats">⬅ VOLVER</button>
        <h2>ESTADÍSTICAS</h2>
        <div id="statsContent"></div>
      </section>

    </main>

    <footer>
      <p>JOKER WORLDS © MIDNIGHT ARCADE</p>
    </footer>

  </div>

  <script src="expansion.js"></script>
  <script src="game.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("Service Worker:", error));
      });
    }
  </script>
</body>
</html>
