<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Estilo Balatro - Arcade Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fuente retro estilo arcade -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Contenedor Principal del Juego -->
    <div id="game-container" class="pixel-theme">

        <!-- MENÚ PRINCIPAL -->
        <div id="main-menu" class="screen">
            <h1 class="game-title">ROGUELIKE POKER</h1>
            <div class="menu-buttons">
                <button class="arcade-btn" id="btn-start">JUGAR</button>
                <button class="arcade-btn" id="btn-skills">ÁRBOL DE HABILIDADES</button>
                <button class="arcade-btn" id="btn-stats">ESTADÍSTICAS</button>
            </div>
        </div>

        <!-- PANTALLA DE JUEGO / PARTIDA -->
        <div id="game-screen" class="screen hidden">
            <!-- Cabecera de Estadísticas y Rondas -->
            <header class="game-header">
                <div class="stat-box">Ronda: <span id="round-num">1</span></div>
                <div class="stat-box">Fichas: <span id="chips-num">0</span></div>
                <div class="stat-box">Puntuación: <span id="score-num">0</span> / <span id="target-num">300</span></div>
            </header>

            <!-- LA MÁQUINA DE CASINO / TRAGAMONEDAS -->
            <div class="slot-machine-container">
                <div class="slot-lights"><span>🔴</span><span>🟡</span><span>🟢</span><span>🟡</span><span>🔴</span></div>
                <div class="slot-screen">
                    <div class="slot-reel" id="reel-1">🃏</div>
                    <div class="slot-reel" id="reel-2">🃏</div>
                    <div class="slot-reel" id="reel-3">🃏</div>
                </div>
                <button class="arcade-btn spin-arcade-btn" id="btn-spin">GIRAR / JUGAR MANO</button>
            </div>

            <!-- Área de Comodines / Jokers -->
            <section class="jokers-section">
                <h3>COMODINES (JOKERS)</h3>
                <div class="jokers-grid" id="jokers-container">
                    <!-- Los comodines se cargan aquí -->
                    <div class="joker-slot empty">VACÍO</div>
                    <div class="joker-slot empty">VACÍO</div>
                    <div class="joker-slot empty">VACÍO</div>
                </div>
            </section>

            <!-- Área de Cartas del Jugador -->
            <section class="hand-section">
                <h3>TU MANO</h3>
                <div class="cards-container" id="player-hand">
                    <!-- Las cartas se generan dinámicamente -->
                </div>
            </section>

            <button class="arcade-btn secondary-btn" id="btn-back-menu">VOLVER AL MENÚ</button>
        </div>

        <!-- PANTALLA DE ÁRBOL DE HABILIDADES -->
        <div id="skills-screen" class="screen hidden">
            <h2>ÁRBOL DE HABILIDADES</h2>
            <div class="skills-tree-container">
                <div class="skill-node">
                    <span>+ Fichas Iniciales</span>
                    <button class="arcade-btn small-btn">MEJORAR</button>
                </div>
                <div class="skill-node">
                    <span>Multiplicador de Jokers</span>
                    <button class="arcade-btn small-btn">MEJORAR</button>
                </div>
            </div>
            <button class="arcade-btn" id="btn-close-skills">VOLVER</button>
        </div>

        <!-- PANTALLA DE ESTADÍSTICAS -->
        <div id="stats-screen" class="screen hidden">
            <h2>ESTADÍSTICAS</h2>
            <div class="stats-box-content">
                <p>Partidas Jugadas: <span id="stat-played">0</span></p>
                <p>Partidas Ganadas: <span id="stat-won">0</span></p>
                <p>Máxima Puntuación: <span id="stat-highscore">0</span></p>
            </div>
            <button class="arcade-btn" id="btn-close-stats">VOLVER</button>
        </div>

    </div>

    <script src="game.js"></script>
</body>
</html>
